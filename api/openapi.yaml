openapi: 3.0.3
info:
  title: Test Session API
  description: Backend API for test session application form and submission management
  version: 1.0.0
tags:
  - name: TestSessionApplicationForm
    description: Operations on test session application forms
  - name: TestSessionSubmission
    description: Operations on test session submissions
paths:
  /api/v1/test-sessions/application-forms:
    get:
      tags:
        - TestSessionApplicationForm
      operationId: listTestSessionApplicationForms
      summary: List all test session application forms
      responses:
        '200':
          description: List of test session application forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestSessionApplicationFormResponse'
    post:
      tags:
        - TestSessionApplicationForm
      operationId: createTestSessionApplicationForm
      summary: Create a new test session application form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSessionApplicationFormRequest'
      responses:
        '201':
          description: Test session application form created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSessionApplicationFormResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/test-sessions/application-forms/{applicationFormId}:
    get:
      tags:
        - TestSessionApplicationForm
      operationId: getTestSessionApplicationForm
      summary: Get a test session application form by ID
      parameters:
        - name: applicationFormId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Test session application form found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSessionApplicationFormResponse'
        '404':
          description: Test session application form not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - TestSessionApplicationForm
      operationId: updateTestSessionApplicationForm
      summary: Update an existing test session application form
      parameters:
        - name: applicationFormId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSessionApplicationFormUpdateRequest'
      responses:
        '200':
          description: Test session application form updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSessionApplicationFormResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Test session application form not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - TestSessionApplicationForm
      operationId: deleteTestSessionApplicationForm
      summary: Delete a test session application form
      parameters:
        - name: applicationFormId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Test session application form deleted
        '404':
          description: Test session application form not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/test-sessions/submissions:
    get:
      tags:
        - TestSessionSubmission
      operationId: listTestSessionSubmissions
      summary: List all submissions
      parameters:
        - name: formId
          in: query
          required: false
          description: Filter submissions by application form ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestSessionSubmissionResponse'
    post:
      tags:
        - TestSessionSubmission
      operationId: createTestSessionSubmission
      summary: Submit data against a test session application form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSessionSubmissionRequest'
      responses:
        '201':
          description: Submission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSessionSubmissionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/test-session/submissions/{submissionId}:
    get:
      tags:
        - TestSessionSubmission
      operationId: getTestSessionSubmission
      summary: Get a specific submission
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Submission found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSessionSubmissionResponse'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - TestSessionSubmission
      operationId: updateTestSessionSubmission
      summary: Update a submission
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSessionSubmissionRequest'
      responses:
        '200':
          description: Submission updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSessionSubmissionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - TestSessionSubmission
      operationId: deleteTestSessionSubmission
      summary: Delete a submission
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Submission deleted
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    TestSessionApplicationFormRequest:
      type: object
      required:
        - name
        - fields
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Employee Onboarding Form
        description:
          type: string
          maxLength: 1000
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FormFieldDefinitionRequest'
    TestSessionApplicationFormUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FormFieldDefinitionRequest'
    TestSessionApplicationFormResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormFieldDefinition'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FormFieldDefinition:
      type: object
      required:
        - id
        - name
        - label
        - type
        - required
      properties:
        id:
          type: string
          description: Server-generated unique identifier for this field
        name:
          type: string
          description: |
            Form field key used in submission data. Not required for layout types (heading, separator, section).
          example: email
        label:
          type: string
          description: Display label or display text for layout elements
          example: Email Address
        type:
          type: string
          enum:
            - text
            - number
            - email
            - password
            - textarea
            - date
            - file
            - select
            - radio
            - checkbox
            - multibox
            - section
            - heading
            - separator
        required:
          type: boolean
          default: false
        placeholder:
          type: string
          nullable: true
        defaultValue:
          type: string
          nullable: true
        options:
          type: array
          nullable: true
          description: Required for select, radio, and multibox types
          items:
            $ref: '#/components/schemas/SelectOption'
        validation:
          $ref: '#/components/schemas/FieldValidation'
          nullable: true
    FormFieldDefinitionRequest:
      type: object
      required:
        - name
        - label
        - type
        - required
      properties:
        name:
          type: string
          description: |
            Form field key used in submission data. Not required for layout types (heading, separator, section).
          example: email
        label:
          type: string
          description: Display label or display text for layout elements
          example: Email Address
        type:
          type: string
          enum:
            - text
            - number
            - email
            - password
            - textarea
            - date
            - file
            - select
            - radio
            - checkbox
            - multibox
            - section
            - heading
            - separator
        required:
          type: boolean
          default: false
        placeholder:
          type: string
          nullable: true
        defaultValue:
          type: string
          nullable: true
        options:
          type: array
          nullable: true
          description: Required for select, radio, and multibox types
          items:
            $ref: '#/components/schemas/SelectOption'
        validation:
          $ref: '#/components/schemas/FieldValidation'
          nullable: true
    SelectOption:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
        value:
          type: string
    FieldValidation:
      type: object
      description: |
        Validation rules for the field. Not applicable to layout types. The "preset" field is a user-friendly shortcut that auto-populates "pattern".
      properties:
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        minLength:
          type: integer
          nullable: true
        maxLength:
          type: integer
          nullable: true
        preset:
          type: string
          nullable: true
          enum:
            - none
            - email
            - url
            - phone
            - alphanumeric
            - letters_only
            - numbers_only
            - no_special_chars
        pattern:
          type: string
          nullable: true
          description: Regex pattern (auto-filled from preset on the frontend)
    TestSessionSubmissionRequest:
      type: object
      required:
        - formId
        - data
      properties:
        formId:
          type: integer
          format: int64
          description: ID of the test session application form this submission belongs to
        data:
          type: object
          additionalProperties: true
          description: |
            Key-value map where keys match field "name" from the test session. Value types depend on field type:
              text/email/password/textarea/date/select/radio: string,
              number: string or number,
              checkbox: boolean,
              multibox: array of strings,
              file: string (URL or file reference),
              heading/separator/section: not present (layout-only)
    TestSessionSubmissionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        formId:
          type: integer
          format: int64
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: string
